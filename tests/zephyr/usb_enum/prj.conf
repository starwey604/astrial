# New (device_next) USB device stack. The legacy stack is deprecated on
# Zephyr main and lacks the HS path used here.
CONFIG_USB_DEVICE_STACK_NEXT=y

# Built-in loopback class: interface 0, vendor class, bulk OUT 0x01 and
# bulk IN 0x81 -- the exact layout astrial::usb selects by default.
# Not sample code; it ships with the device stack itself.
CONFIG_USBD_LOOPBACK_CLASS=y

# MCXN947 has an EHCI controller with on-chip HS PHY. Make High Speed
# explicit instead of relying on the driver-implied default.
CONFIG_USBD_MAX_SPEED_HIGH=y

# Room for several in-flight transfers. The default of 1024 bytes is too
# small for 512-byte HS bulk packets; raise further for the throughput
# benchmarks later.
CONFIG_UDC_BUF_POOL_SIZE=8192

CONFIG_LOG=y
